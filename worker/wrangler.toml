name = "sightline-api"
main = "index.js"
compatibility_date = "2026-01-01"

# Keys are SECRETS, never vars. Set them after the first deploy:
#   wrangler secret put GEMINI_KEY        (required - ai.google.dev, free tier)
#   wrangler secret put PLANTNET_KEY      (optional - my.plantnet.org, free 500/day)
#   wrangler secret put VISION_KEY        (optional - Google Cloud Vision web detection)
[vars]
MODEL = "gemini-2.0-flash"
ALLOW_ORIGIN = "*"      # tighten to your Pages origin once deployed
RL_BURST = "40"
RL_WINDOW = "60"
MAX_IMAGE_KB = "1400"
