# XcodeGen spec used by the cloud build (.github/workflows/vision-ios.yml).
# It compiles the same sources as Vision.swiftpm, so you never need Xcode.
name: Vision
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  Vision:
    type: application
    platform: iOS
    # Listed file by file: XcodeGen treats a *.swiftpm folder as an opaque
    # bundle and would copy it as a resource instead of compiling it.
    sources:
      - Vision.swiftpm/VisionApp.swift
      - Vision.swiftpm/Spatial.swift
      - Vision.swiftpm/SpatialWindow.swift
      - Vision.swiftpm/HandTracker.swift
      - Vision.swiftpm/Apps.swift
      - Vision.swiftpm/Assets.xcassets
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Vision
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        NSCameraUsageDescription: Vision shows your room and tracks your hands so you can touch windows in the air.
        NSLocationWhenInUseUsageDescription: Weather uses your location for the local forecast.
        NSPhotoLibraryUsageDescription: Add photos to float them in your room.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arankeyhan.vision
        # A module named "Vision" would shadow Apple's Vision framework.
        PRODUCT_MODULE_NAME: SpatialVision
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
